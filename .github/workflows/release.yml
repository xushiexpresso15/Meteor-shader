name: Release Shader Packs

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package shader packs
        run: |
          VERSION=$(jq -r .version meteor-dusk/pack.json)
          TAG="v${VERSION}"
          mkdir -p dist
          (cd meteor-dusk && zip -qr "../dist/meteor-dusk-${VERSION}.zip" pack.json pack.ts shaders -x '*.DS_Store' '*__MACOSX*')
          (cd meteor-zenith && zip -qr "../dist/meteor-zenith-${VERSION}.zip" pack.json pack.ts shaders -x '*.DS_Store' '*__MACOSX*')
          (cd dist && shasum -a 256 *.zip > SHA256SUMS.txt)
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS.txt --title "Meteor Shader ${RELEASE_TAG}" --notes-file CHANGELOG.md --prerelease
          fi
